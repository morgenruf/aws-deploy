name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint CloudFormation templates
        run: cfn-lint aws/starter.yaml aws/production.yaml
